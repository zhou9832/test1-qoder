# Comment API Contract Supplement

> 对应 TaskBoard 评论功能，需追加到 `api-contract-v1.yaml` 的"工时记录"之后、"统计报表"之前。

---

### 评论管理

#### 获取任务的评论列表（分页）

```yaml
  /api/tasks/{taskId}/comments:
    get:
      summary: "获取任务的评论列表（分页）"
      tags: [Comment]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: "成功返回分页评论列表"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PageResult'
                        allOf:
                          - properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/CommentDto'
                        required: [items, total, page, size]
```

#### 发表评论

```yaml
  /api/tasks/{taskId}/comments:
    post:
      summary: "发表评论"
      tags: [Comment]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [content]
              properties:
                author:
                  type: string
                  maxLength: 64
                  description: "作者名（可选，最大 64 字符）"
                content:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: "评论内容（必填）"
      responses:
        '201':
          description: "评论创建成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CommentDto'
        '400':
          description: "参数校验失败"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: null
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/ErrorItem'
        '404':
          description: "任务不存在"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: null
                      errors:
                        items:
                          - code: 40004
                            message: "任务不存在"
```

#### 删除评论

```yaml
  /api/comments/{id}:
    delete:
      summary: "删除评论"
      tags: [Comment]
      description: |
        **删除策略**：物理删除，不可恢复。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: "删除成功"
        '404':
          description: "评论不存在"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: null
                      errors:
                        items:
                          - code: 40004
                            message: "评论不存在"
```

---

### DTO 定义（需追加到 api-contract-v1.yaml 的 DTO 部分）

```yaml
components:
  schemas:
    CommentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        author:
          type: string
          nullable: true
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, taskId, content, createdAt]
```
