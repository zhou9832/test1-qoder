### 任务管理

#### 获取任务列表（分页 + 过滤）

```yaml
  /api/tasks:
    get:
      summary: "获取任务列表（分页 + 过滤）"
      tags: [Task]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: projectId
          in: query
          schema:
            type: integer
            format: int64
          description: "按项目过滤（可选）"
        - name: status
          in: query
          schema:
            type: string
            enum: [TODO, IN_PROGRESS, DONE, CLOSED]
          description: "按状态过滤（可选）"
      responses:
        '200':
          description: "成功返回分页任务列表"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PageResult'
                        allOf:
                          - properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/TaskDto'
                        required: [items, total, page, size]
```

#### 新建任务

```yaml
  /api/tasks:
    post:
      summary: "新建任务"
      tags: [Task]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [projectId, title]
              properties:
                projectId:
                  type: integer
                  format: int64
                  description: "所属项目 ID（必填）"
                title:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: "任务标题（必填）"
                description:
                  type: string
                  maxLength: 1024
                  description: "任务描述（可选）"
                status:
                  type: string
                  enum: [TODO, IN_PROGRESS, DONE, CLOSED]
                  default: TODO
                  description: "初始状态（默认为 TODO）"
                priority:
                  type: integer
                  minimum: 0
                  maximum: 3
                  default: 0
                  description: "优先级 0-3（0 最低）"
                dueAt:
                  type: string
                  format: date-time
                  description: "到期时间（可选，ISO-8601）"
                tagIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: "关联标签 ID 列表（可选）"
      responses:
        '201':
          description: "任务创建成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TaskDto'
```

