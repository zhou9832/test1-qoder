#### 删除项目（级联策略声明）

```yaml
  /api/projects/{id}:
    delete:
      summary: "删除项目"
      tags: [Project]
      description: |
        **删除策略**：级联删除该项目下的所有 Task，Task 的 TimeLog 随 Task 级联删除。
        此操作不可恢复，前端需二次确认。
        
        **引用契约条款**：PRD B.3 "删除 Project 级联删除其 Task、Task 的 TimeLog"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: "删除成功（无内容返回）"
        '404':
          description: "项目不存在"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: null
                      errors:
                        items:
                          - code: 40004
                            message: "项目不存在"
```

