#### 填报工时

```yaml
  /api/timelogs:
    post:
      summary: "填报工时"
      tags: [TimeLog]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [taskId, hours, workDate]
              properties:
                taskId:
                  type: integer
                  format: int64
                  description: "任务 ID（必填）"
                hours:
                  type: string
                  description: "工时值（字符串或整数分钟，禁止浮点）"
                  example: "45"
                workDate:
                  type: string
                  format: date
                  description: "工作日期（ISO-8601 日期格式）"
                  example: "2026-09-29"
                note:
                  type: string
                  maxLength: 256
                  description: "备注（可选）"
      responses:
        '201':
          description: "工时填报成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TimeLogDto'
```

