# TaskBoard API Contract v1

> 对应 PRD B.5 端点清单，受章程红线 6、30 号契约规则约束。  
> 全部响应包裹 `ApiResponse<T>`，分页用 `PageResult<T>`，时间 ISO-8601 带时区偏移。  
> 错误码分段：40xxx 参数/校验、42xxx 状态流转、49xxx 内部错误。

## 全局约定

### 响应包装结构

```yaml
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: "业务状态码；0=成功"
          example: 0
        message:
          type: string
          description: "人类可读消息（可回显前端）"
          example: Success
        data:
          description: "泛型数据载体（具体类型随端点变化）"
      required: [code, message, data]
    
    PageResult:
      type: object
      description: "分页结果容器"
      properties:
        items:
          type: array
          items: {}
          description: "当前页数据列表"
        total:
          type: integer
          format: int64
          description: "总记录数"
        page:
          type: integer
          format: int32
          description: "当前页码（从 1 起）"
          example: 1
        size:
          type: integer
          format: int32
          description: "每页大小（默认 20，上限 100）"
          example: 20
      required: [items, total, page, size]
    
    ErrorItem:
      type: object
      description: "统一错误详情"
      properties:
        code:
          type: integer
          format: int32
          description: "业务细分错误码"
        field:
          type: string
          description: "绑定失败的字段名（参数校验类错误使用）"
          nullable: true
        message:
          type: string
          description: "错误描述"
      required: [code, message]
```

### 分页参数约定

所有分页接口统一使用查询参数：

| 参数 | 类型 | 必填 | 默认值 | 上限 | 说明 |
| --- | --- | --- | --- | --- | --- |
| `page` | integer | 否 | 1 | — | 页码从 1 起 |
| `size` | integer | 否 | 20 | 100 | 每页大小 |

### 时间格式约定

| 场景 | 格式 | 示例 |
| --- | --- | --- |
| 数据库存储 | TIMESTAMP | H2 原生类型 |
| Java 侧 | `Instant` | — |
| JSON 传输 | ISO-8601 + 时区偏移 | `2026-09-29T10:30:00Z` 或 `2026-09-29T18:30:00+08:00` |
| 前端展示 | ISO-8601 字符串 | 由 `utils/format.ts` 处理，禁止 `new Date().toLocaleString()` |

### 错误码分配表

| 段 | 用途 | 示例 |
| --- | --- | --- |
| `40xxx` | 参数与校验错误 | `40001` 必填项缺失, `40002` 超出长度限制, `40003` 重复名称 |
| `41xxx` | 权限错误（预留） | `41001` 未登录, `41002` Token 过期 |
| `42xxx` | 状态流转错误 | `42001` 非法状态转换, `42002` 终态不可修改 |
| `49xxx` | 内部错误 | `49001` 数据库异常, `49002` 外部调用失败 |

