## 端点清单

### 健康检查

#### 获取系统健康状态

```yaml
paths:
  /api/health:
    get:
      summary: "获取系统健康状态"
      tags: [System]
      responses:
        '200':
          description: "健康检查成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                allOf:
                  - properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [UP, DOWN]
                            example: UP
                          timestamp:
                            type: string
                            format: date-time
                            description: "服务器当前时间"
                        required: [status, timestamp]
              example:
                code: 0
                message: Success
                data:
                  status: UP
                  timestamp: "2026-09-29T10:30:00Z"
```

