### 项目管理

#### 获取项目列表（分页）

```yaml
  /api/projects:
    get:
      summary: "获取项目列表（分页）"
      tags: [Project]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 64
          description: "按项目名称模糊搜索（可选）"
      responses:
        '200':
          description: "成功返回分页项目列表"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PageResult'
                        allOf:
                          - properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/ProjectDto'
                        required: [items, total, page, size]
              example:
                code: 0
                message: Success
                data:
                  items:
                    - id: 1
                      name: 教程研发
                      description: 开发教学文档
                      createdAt: "2026-09-29T10:00:00Z"
                      updatedAt: "2026-09-29T12:00:00Z"
                  total: 3
                  page: 1
                  size: 20
```

#### 新建项目

```yaml
  /api/projects:
    post:
      summary: "新建项目"
      tags: [Project]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: "项目名称（必填、唯一）"
                description:
                  type: string
                  maxLength: 512
                  description: "项目描述（可选）"
              required: [name]
      responses:
        '201':
          description: "项目创建成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ProjectDto'
              example:
                code: 0
                message: Success
                data:
                  id: 4
                  name: 新項目
                  description: 描述信息
                  createdAt: "2026-09-29T14:00:00Z"
                  updatedAt: "2026-09-29T14:00:00Z"
        '400':
          description: "参数校验失败"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: null
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/ErrorItem'
                        example:
                          - code: 40001
                            field: name
                            message: "项目名称不能为空"
                          - code: 40002
                            field: name
                            message: "项目名称不能超过64个字符"
```

