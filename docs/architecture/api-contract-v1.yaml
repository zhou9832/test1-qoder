## 契约要点总结

| 要点 | 规则 |
| --- | --- |
| 统一响应包裹 | 所有端点返回 `ApiResponse<T>`，成功 `code=0` |
| 分页标准 | `page`（从 1 起）、`size`（默认 20，上限 100），响应 `PageResult<T>` |
| 时间格式 | 传输 ISO-8601 带时区，前端走统一工具处理 |
| 错误码分段 | 40xxx 参数校验 / 41xxx 权限 / 42xxx 状态流转 / 49xxx 内部错误 |
| 动作端点命名 | `/api/<资源>/<id>/<动作>`（如 `/api/tasks/1/transitions`） |
| 删除级联声明 | 删除接口 `description` 必须声明关联数据处理方式（见各 DELETE 端点） |
| 状态变更隔离 | `status` 不得在 PUT /tasks/{id} 中修改，只能走 `/transitions` 端点 |
| 表单提交格式 | 后端使用 `application/x-www-form-urlencoded`（便于 Spring @RequestParam 接收） |
| 工时禁浮点 | `TimeLog.hours` 使用 String 存储，避免精度问题 |
