#### 状态流转（动作端点）

```yaml
  /api/tasks/{id}/transitions:
    patch:
      summary: "任务状态流转"
      tags: [Task]
      description: |
        **状态机校验**：合法性只在 service 层判定，非法流转返回 42xxx 错误码。
        
        **引用状态机规则**：PRD B.4
        
        ```mermaid
        stateDiagram-v2
            [*] --> TODO
            TODO --> IN_PROGRESS : 合法
            IN_PROGRESS --> DONE : 合法
            IN_PROGRESS --> TODO : 回退，合法
            DONE --> CLOSED : 合法
            DONE --> IN_PROGRESS : 重开，合法
            CLOSED --> [*]
            TODO --> DONE : 非法（须经过进行中）
            TODO --> CLOSED : 非法
        ```
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [TODO, IN_PROGRESS, DONE, CLOSED]
                  description: "目标状态"
      responses:
        '200':
          description: "状态流转成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TaskTransitionResult'
        '400':
          description: "非法状态流转"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: null
                      errors:
                        items:
                          - code: 42001
                            message: "不允许从当前状态直接转移到目标状态"
        '404':
          description: "任务不存在"
        '42002':
          description: "终态不可修改"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: null
                      errors:
                        items:
                          - code: 42002
                            message: "任务已关闭，不可再修改"

    components:
      schemas:
        TaskTransitionResult:
          type: object
          description: "状态流转结果"
          properties:
            taskId:
              type: integer
              format: int64
            previousStatus:
              type: string
              enum: [TODO, IN_PROGRESS, DONE, CLOSED]
            currentStatus:
              type: string
              enum: [TODO, IN_PROGRESS, DONE, CLOSED]
            transitionedAt:
              type: string
              format: date-time
          required: [taskId, previousStatus, currentStatus, transitionedAt]
```

#### 删除任务（级联策略声明）

```yaml
  /api/tasks/{id}:
    delete:
      summary: "删除任务"
      tags: [Task]
      description: |
        **删除策略**：级联删除该任务的所有 TimeLog，并通过 JPA REMOVE 操作解除与 Tag 的关联记录。
        此操作不可恢复，前端需二次确认。
        
        **引用契约条款**：PRD B.3 "删除 Task 级联删除其 TimeLog 并解除与 Tag 的关联"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: "删除成功"
        '404':
          description: "任务不存在"
```

